<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f24" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Yörünge</title>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="app">
      <header class="hud">
        <div class="best" aria-label="best">
          <svg viewBox="0 0 24 24" aria-hidden="true" id="best-ico"><path d="M3 8l4.5 3.5L12 5l4.5 6.5L21 8l-2 11H5z" /></svg>
          <svg viewBox="0 0 24 24" aria-hidden="true" id="level-ico" hidden><path d="M6 21V4h11l-2 4 2 4H8v9z" /></svg>
          <span id="best">0</span>
        </div>
        <div class="score" id="score">0</div>
        <button class="icon-btn" id="pause-btn" aria-label="pause">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.5" /><rect x="14" y="5" width="4" height="14" rx="1.5" /></svg>
        </button>
      </header>
      <div class="hint" id="hint"><p class="goal" id="goal" hidden></p><p data-i18n="tapToStart"></p></div>
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
