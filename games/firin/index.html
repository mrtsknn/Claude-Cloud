<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#3a2318" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Fırın</title>
  </head>
  <body>
    <div id="game" hidden>
      <div class="awning"></div>
      <header class="hud">
        <button class="icon-btn" id="pause-btn" aria-label="pause">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5v14M15 5v14" /></svg>
        </button>
        <div class="goal">
          <div class="goal-top"><b id="level-label"></b><span id="coins-label"></span></div>
          <div class="goal-bar"><i id="goal-fill"></i><s style="left: 62.5%"></s><s style="left: 81.25%"></s></div>
        </div>
        <div class="timer" id="timer">1:30</div>
      </header>
      <section class="counter" id="counter"></section>
      <div class="tray" id="tray"></div>
      <section class="ovens" id="ovens"></section>
      <nav class="stations" id="stations"></nav>
      <p class="hint" id="hint" hidden></p>
      <div class="toast" id="toast" hidden></div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
