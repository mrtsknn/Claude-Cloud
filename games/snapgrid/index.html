<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#10142a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Snapgrid</title>
  </head>
  <body>
    <div id="app">
      <header class="hud">
        <div class="hud-left">
          <div class="best" id="best-wrap" aria-label="best">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8l4.5 3.5L12 5l4.5 6.5L21 8l-2 11H5z" /></svg>
            <span id="best">0</span>
          </div>
          <div class="lvl" id="lvl" hidden></div>
        </div>
        <div class="score-wrap">
          <div class="score" id="score">0</div>
          <div class="score-sub" id="score-sub" hidden></div>
        </div>
        <button class="icon-btn" id="settings-btn" aria-label="pause">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.5" /><rect x="14" y="5" width="4" height="14" rx="1.5" /></svg>
        </button>
      </header>
      <div class="subbar">
        <div class="goals" id="goals"></div>
        <div class="boosters" id="boosters"></div>
      </div>
      <div class="stage-wrap">
        <canvas id="stage"></canvas>
        <div class="aim" id="aim" hidden></div>
        <div class="stuck" id="stuck" hidden><span data-i18n="stuck"></span><button id="give-up" data-i18n="giveUp"></button></div>
        <div class="intro" id="intro" hidden></div>
      </div>
    </div>
    <div class="flash" id="flash"></div>
    <div class="confetti" id="confetti"></div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
