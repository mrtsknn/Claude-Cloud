<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#2fb9bd" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Gelgit</title>
  </head>
  <body>
    <div id="app">
      <canvas id="stage"></canvas>
      <header class="hud">
        <button class="icon-btn" id="settings-btn" aria-label="settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
        </button>
        <div class="score-box">
          <span class="eyebrow" id="round"></span>
          <b id="score">0</b>
        </div>
        <div class="best" aria-label="best">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8l4.5 3.5L12 5l4.5 6.5L21 8l-2 11H5z" /></svg>
          <span id="best">0</span>
        </div>
      </header>
      <nav class="bar">
        <div class="chip" id="bucket-chip">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M5 8h14l-1.6 11.2a2 2 0 0 1-2 1.8H8.6a2 2 0 0 1-2-1.8z" /><path d="M6 8a6 6 0 0 1 12 0" /></svg>
          <b id="buckets">0</b>
        </div>
        <button class="wave-btn" id="wave-btn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 15c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2M2 19c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2M6 10c0-3 2.5-5 6-5 2 0 3.5 1 4 2.5-1.5-.5-3.5 0-3.5 2" /></svg>
          <span data-i18n="wave"></span>
        </button>
        <div class="chip" id="castle-chip">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M4 21V10h3v2h2.5V10h5v2H17v-2h3v11z" /><path d="M12 10V3l4 1.5L12 6" /></svg>
          <b id="castles">0</b>
        </div>
      </nav>
      <div class="hand" id="hand" hidden>
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <path d="M24 30V10a5 5 0 0 1 10 0v16l12.5 2.6A6 6 0 0 1 51 35l-2.6 13A10 10 0 0 1 38.6 56H30a10 10 0 0 1-7.6-3.5L13 41.5a4.6 4.6 0 0 1 6.5-6.4z" />
        </svg>
      </div>
      <div class="toast" id="toast" hidden></div>
    </div>

    <div class="overlay" id="settings" hidden>
      <div class="sheet">
        <h2 data-i18n="settings"></h2>
        <label class="row"><span data-i18n="sound"></span><input type="checkbox" id="opt-sound" class="switch" /></label>
        <label class="row"><span data-i18n="vibration"></span><input type="checkbox" id="opt-haptics" class="switch" /></label>
        <button class="btn ghost" id="restart-btn" data-i18n="restart"></button>
        <button class="btn" id="close-settings" data-i18n="resume"></button>
        <p class="foot"><a href="#" id="privacy-link" data-i18n="privacy"></a> · <span id="version"></span></p>
      </div>
    </div>

    <div class="overlay" id="gameover" hidden>
      <div class="sheet center">
        <p class="eyebrow" id="go-title"></p>
        <div class="big" id="go-score">0</div>
        <p class="muted" id="go-best"></p>
        <div class="stats">
          <div><b id="go-rounds">0</b><span data-i18n="rounds"></span></div>
        </div>
        <button class="btn revive" id="revive-btn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" /></svg><span data-i18n="revive"></span>
        </button>
        <button class="btn" id="again-btn" data-i18n="playAgain"></button>
      </div>
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
