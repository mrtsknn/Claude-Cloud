<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#dce4ea" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Terazi</title>
  </head>
  <body>
    <div id="app">
      <header class="hud">
        <button class="icon-btn" id="pause-btn" aria-label="pause">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5v14M15 5v14" /></svg>
        </button>
        <div class="level">
          <span class="eyebrow" data-i18n="level"></span>
          <b id="level">1</b>
          <span class="stars" id="stars"><i>★</i><i>★</i><i>★</i></span>
        </div>
        <button class="icon-btn" id="restart-btn" aria-label="restart">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" /></svg>
        </button>
      </header>
      <canvas id="stage"></canvas>
      <div class="toast" id="toast" hidden></div>
      <nav class="tools">
        <button class="tool" id="undo-btn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3" /></svg>
          <span data-i18n="undo"></span>
        </button>
        <button class="tool" id="hint-btn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z" /></svg>
          <span data-i18n="hint"></span><i class="badge" id="hint-badge">1</i>
        </button>
      </nav>
    </div>

    <div class="overlay" id="hint-sheet" hidden>
      <div class="sheet center">
        <h2 data-i18n="hintTitle"></h2>
        <p class="muted" data-i18n="hintNote"></p>
        <button class="btn" id="hint-coins"></button>
        <button class="btn alt" id="hint-video">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3" /><path d="M10 9v6l5-3z" /></svg>
          <span data-i18n="hintVideo"></span>
        </button>
        <button class="btn ghost" id="hint-close" data-i18n="close"></button>
      </div>
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
