<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#2b1a08" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Kovan</title>
  </head>
  <body>
    <div id="app">
      <header class="hud">
        <button class="icon-btn" id="menu-btn" aria-label="menu">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
        </button>
        <div class="honey">
          <span class="drop"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c3 4.5 6 7.8 6 11a6 6 0 0 1-12 0c0-3.2 3-6.5 6-11z" /></svg><b id="honey">0</b></span>
          <small id="rate"></small>
        </div>
        <button class="coins" id="coins-btn" aria-label="coins">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="#ffc83d" stroke="#b57d10" stroke-width="2" /></svg>
          <b id="coins">0</b>
        </button>
      </header>
      <canvas id="stage"></canvas>
      <nav class="bar">
        <button class="tool" id="up-btn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6" /></svg>
          <span data-i18n="upgrades"></span><i class="dot" id="up-badge" hidden></i>
        </button>
        <button class="egg" id="egg-btn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c-3.6 0-6.5 6-6.5 10.3a6.5 6.5 0 0 0 13 0C18.5 9 15.6 3 12 3z" /></svg>
          <span data-i18n="egg"></span>
          <b><svg class="mini" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c3 4.5 6 7.8 6 11a6 6 0 0 1-12 0c0-3.2 3-6.5 6-11z" /></svg><em id="egg-cost">0</em></b>
        </button>
        <button class="tool gold" id="gold-btn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c-3.6 0-6.5 6-6.5 10.3a6.5 6.5 0 0 0 13 0C18.5 9 15.6 3 12 3z" /><path d="M9 12l2 2 4-4" /></svg>
          <span data-i18n="golden"></span><small class="price"><i class="c"></i><em id="gold-price"></em></small>
        </button>
      </nav>
    </div>

    <div class="overlay" id="sheet" hidden><div class="sheet" id="sheet-body"></div></div>
    <div class="toast" id="toast" hidden></div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
