<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#e6ede1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Devril</title>
  </head>
  <body>
    <div id="app">
      <header class="hud">
        <button class="icon-btn" id="settings-btn" aria-label="pause">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6v12M15 6v12" /></svg>
        </button>
        <div class="level">
          <span class="eyebrow" data-i18n="level"></span>
          <b id="level">1</b>
          <span class="mini-stars" id="level-stars"><i></i><i></i><i></i></span>
        </div>
        <button class="icon-btn" id="restart-btn" aria-label="restart">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" /></svg>
        </button>
      </header>
      <div class="meter">
        <span><span data-i18n="taps"></span> <b id="taps">0</b></span>
        <span class="dot"></span>
        <span><span data-i18n="par"></span> <b id="par">0</b></span>
        <span class="cap" id="meter-cap" hidden><span data-i18n="hintCap"></span></span>
      </div>
      <canvas id="stage"></canvas>
      <div class="toast" id="toast" hidden></div>
      <div class="tip" id="tip" hidden></div>
      <nav class="tools">
        <button class="tool" id="undo-btn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3" /></svg>
          <span data-i18n="undo"></span>
        </button>
        <button class="push" id="push-btn"><span id="push-label"></span></button>
        <button class="tool" id="hint-btn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z" /></svg>
          <span data-i18n="hint"></span><i class="badge" id="hint-badge">1</i>
        </button>
      </nav>
    </div>

    <div class="hand" id="hand" hidden><svg viewBox="0 0 64 64" aria-hidden="true">
      <path d="M26 30V10a5 5 0 0 1 10 0v16l13 3c4 1 6 4 5 8l-3 13c-1 5-5 8-10 8H30c-3 0-6-2-8-4L11 41c-2-3-1-6 2-7 2-1 5 0 6 2l7 8z" />
    </svg></div>

    <div class="overlay" id="hint-sheet" hidden>
      <div class="sheet center">
        <h2 data-i18n="hintTitle"></h2>
        <p class="muted" data-i18n="hintNote"></p>
        <p class="balance" id="hint-balance"></p>
        <button class="btn" id="hint-coins"></button>
        <button class="btn alt" id="hint-video">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3" /><path d="M10 9v6l5-3z" /></svg>
          <span data-i18n="watchVideo"></span>
        </button>
        <button class="btn ghost" id="hint-cancel" data-i18n="cancel"></button>
      </div>
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
