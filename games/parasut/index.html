<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#4fb3e8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Paraşüt</title>
  </head>
  <body>
    <div id="app">
      <canvas id="stage"></canvas>
      <header class="hud">
        <button class="icon-btn" id="pause-btn" aria-label="pause">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5v14M15 5v14" /></svg>
        </button>
        <div class="score">
          <span class="eyebrow" id="hud-label"></span>
          <b id="score">0</b>
        </div>
        <div class="wind" id="wind">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h13M13 7l5 5-5 5" /></svg>
          <span id="wind-val"></span>
        </div>
      </header>
      <div class="hint" id="hint" hidden></div>
      <div class="pop" id="pop" hidden></div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
